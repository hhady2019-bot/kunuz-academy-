        }
        function recommendedCourses(course) {
            const tokens = new Set(courseKeywords(course).match(/[a-z]{4,}|[\u0600-\u06ff]{3,}/g) || []);
            const stop = new Set(['with','from','this','that','your','using','learn','understand','marketing','media','course','التي','على','هذا','كيفية','خلال','تعلم','فهم']);
            return courses.filter(other => other.id !== course.id && other.pdfUrl).map(other => {
                const otherTokens = new Set(courseKeywords(other).match(/[a-z]{4,}|[\u0600-\u06ff]{3,}/g) || []);
                let score = 0;
                tokens.forEach(token => { if (!stop.has(token) && otherTokens.has(token)) score++; });
                if (other.levelId === course.levelId) score += 0.5;
                return { course: other, score };
            }).filter(item => item.score > 0).sort((a,b) => b.score-a.score || b.course.publishedAt.localeCompare(a.course.publishedAt)).slice(0,3).map(item => item.course);
        }
        function getVisibleLevels() {
            const highest = Math.max(0, ...courses.filter(c => c.pdfUrl).map(c => c.levelId));
            return levels.filter(level => level.id <= Math.min(10, highest + 1));
        }
        function renderCompanyCard(companyId) {
            const company = companies[companyId];
            const count = courses.filter(c => c.companyId === companyId).length;
            return `<a href="#/company/${companyId}" style="--company-color:${company.color}" class="company-card block bg-white rounded-xl p-6 card-hover transition-smooth">
                <h3 class="font-extrabold text-2xl company-accent">${company.name}</h3>
                <p class="text-sm text-brand-700 mt-2">${count} ${t.all_company_courses}</p>
                <span class="company-accent inline-block mt-4 text-sm font-semibold">${t.explore_company} →</span>
            </a>`;
        }
        function renderCompanyPage(companyId) {
            const company = companies[companyId];
            if (!company) return renderHomePage();
            const companyCourses = courses.filter(c => c.companyId === companyId).sort((a,b) => new Date(b.publishedAt) - new Date(a.publishedAt));
            document.getElementById('app').innerHTML = `<a href="#/" class="text-sm text-brand-700 hover:underline">← ${t.nav_home}</a>
                <div class="mt-7 mb-9 bg-white rounded-xl p-7 company-card" style="--company-color:${company.color}">
                    <h1 class="text-3xl font-extrabold company-accent">${company.name}</h1>
                    <p class="mt-2 text-brand-700">${t.all_company_courses} · ${companyCourses.length}</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">${companyCourses.map(renderCourseCard).join('')}</div>`;
        }
        function updateSearchResults() {
            const input = document.getElementById('global-search');
            const results = document.getElementById('search-results');
            if (!input || !results) return;
            const query = input.value.trim().toLocaleLowerCase();
            input.placeholder = t.search_placeholder;
            if (!query) { results.hidden = true; input.setAttribute('aria-expanded','false'); return; }
            const matchedCourses = courses.filter(c => [courseKeywords(c), companyOf(c).name.toLowerCase(), c.author.toLowerCase(), 'level '+c.levelId, 'المستوى '+c.levelId].some(value => value.includes(query))).slice(0,8);
            const matchedCompanies = Object.entries(companies).filter(([id,company]) => company.name.toLowerCase().includes(query));
            const items = [
                ...matchedCompanies.map(([id,company]) => `<a class="block px-4 py-3 border-b border-slate-100" href="#/company/${id}"><span class="font-bold" style="color:${company.color}">${company.name}</span> · ${t.all_company_courses}</a>`),
                ...matchedCourses.map(c => `<a class="block px-4 py-3 border-b border-slate-100" href="#/course/${c.id}"><span class="block text-sm font-semibold">${c.title[currentLang]}</span><span class="text-xs text-slate-500">${t.level_label} ${c.levelId} · ${companyOf(c).name}</span></a>`)
            ];
            results.innerHTML = items.length ? items.join('') : `<div class="p-4 text-sm text-slate-500">${t.no_search}</div>`;
            results.hidden = false; input.setAttribute('aria-expanded','true');
        }

        // --- STATE & ROUTING ---
        let currentLang = 'en';
        let t = content[currentLang]; // translation object

        function render() {
            const app = document.getElementById('app');
            if (!app) {
                console.error('Kunuz Academy: missing #app container');
                return;
            }
            try {
                renderRoute(app);
            } catch (error) {
                console.error('Kunuz Academy rendering failed:', error);
                app.replaceChildren();
                const panel = document.createElement('section');
                panel.className = 'bg-white border border-brand-100 rounded-xl p-8';
                const heading = document.createElement('h1');
                heading.className = 'text-2xl font-bold text-brand-500 mb-3';
                heading.textContent = currentLang === 'ar' ? 'تعذر عرض الصفحة' : 'Unable to display this page';
                const message = document.createElement('p');
                message.className = 'text-brand-700 mb-4';
                message.textContent = currentLang === 'ar' ? 'حدث خطأ أثناء تحميل المحتوى. يمكنك العودة للرئيسية والمحاولة مجددًا.' : 'An error occurred while loading this content. Return home and try again.';
                const link = document.createElement('a');
                link.href = '#/';
                link.className = 'text-brand-800 font-semibold underline';
                link.textContent = currentLang === 'ar' ? 'العودة للرئيسية' : 'Back to home';
                panel.append(heading, message, link);
                app.appendChild(panel);
            }
        }

        function renderRoute(app) {
            t = content[currentLang];
            document.documentElement.lang = currentLang;
            document.documentElement.dir = t.dir;
            
            // Update static UI elements
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = t[el.getAttribute('data-i18n')];
            });
            const langToggle = document.getElementById('lang-toggle');
            if (langToggle) langToggle.textContent = currentLang === 'en' ? 'العربية' : 'English';

            const hash = window.location.hash || '#/';
            const parts = hash.split('/'); // e.g., #, level, 1
            
            app.innerHTML = ''; // Clear

            if (parts[1] === 'company' && parts[2]) {
                renderCompanyPage(parts[2]);
            } else if (parts[1] === 'level' && parts[2]) {
                renderLevelPage(parseInt(parts[2]));
            } else if (parts[1] === 'course' && parts[2]) {
                renderCoursePage(parseInt(parts[2]));
            } else {
                renderHomePage();
            }
            updateSearchResults();
            window.scrollTo(0, 0);
        }

        // --- VIEWS ---
        
        function renderHomePage() {
            const publishedCourses = courses.filter(c => c.publishedAt).sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt));
            const hasViews = courses.some(c => c.views > 0);

            const html = `
                <!-- Hero -->
                <section class="text-center py-12 md:py-20 border-b border-brand-100">
                    <span class="text-xs font-bold tracking-[0.2em] text-brand-800 uppercase">${t.hero_badge}</span>
                    <h1 class="mt-4 text-3xl md:text-5xl font-extrabold tracking-tight text-brand-500 max-w-3xl mx-auto leading-tight">
                        ${t.hero_title}
                    </h1>
                </section>

                <!-- Recently Added -->
                ${publishedCourses.length > 0 ? `
                    <section class="py-12">
                        <h2 class="text-xl font-bold text-brand-500 mb-6">${t.recently_added}</h2>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            ${publishedCourses.slice(0, 3).map(course => renderCourseCard(course)).join('')}
                        </div>
                    </section>
                ` : ''}

                <!-- Most Read (Hidden if no views) -->
                ${hasViews ? `
                    <section class="py-12 border-t border-brand-100">
                        <h2 class="text-xl font-bold text-brand-500 mb-6">${t.most_read}</h2>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            ${[...courses].sort((a,b) => b.views - a.views).slice(0, 3).map(course => renderCourseCard(course)).join('')}
                        </div>
                    </section>
                ` : ''}

                <!-- Learning Levels -->
                <section class="py-12 border-t border-brand-100">
                    <h2 class="text-xl font-bold text-brand-500 mb-6">${t.levels_title}</h2>
                    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
                        ${getVisibleLevels().map(level => `
                            <a href="#/level/${level.id}" 
                               class="block p-5 bg-white border border-brand-100 rounded-xl transition-smooth card-hover cursor-pointer">
                                <span class="text-sm font-semibold text-brand-700">${t.level_label} ${level.id}</span>
                                <h3 class="mt-1 font-bold text-brand-500 text-sm leading-snug h-10 overflow-hidden">
                                    ${level.status === 'coming_soon' ? t.upcoming : (level.title[currentLang] || '')}
                                </h3>
                                <div class="mt-2 text-[10px] font-semibold inline-block">
                                    ${renderStatusBadge(level.status)}
                                </div>
                            </a>
                        `).join('')}
                    </div>
                </section>
                <section class="py-12 border-t border-brand-100">
                    <h2 class="text-xl font-bold text-brand-500 mb-6">${t.companies_title}</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">${Object.keys(companies).filter(id => courses.some(c => c.companyId === id)).map(renderCompanyCard).join('')}</div>
                </section>
            `;
            document.getElementById('app').innerHTML = html;
        }

        function renderLevelPage(levelId) {
            const level = levels.find(l => l.id === levelId);
            if (!level) return renderHomePage();

            const levelCourses = courses.filter(c => c.levelId === levelId);
            let contentHtml = '';

            if (level.status === 'available') {
                contentHtml = `
                    <!-- Introduction -->
                    ${level.description[currentLang] ? `
                        <section class="mb-10">
                            <h2 class="text-lg font-bold text-brand-500 mb-3">${t.intro_label}</h2>
                            <p class="text-brand-700 leading-relaxed">${level.description[currentLang]}</p>
                        </section>
                    ` : ''}

                    <!-- Outcomes -->
                    ${level.learningOutcomes[currentLang] && level.learningOutcomes[currentLang].length > 0 ? `
                        <section class="mb-10 bg-white p-6 rounded-xl border border-brand-100">
                            <h2 class="text-lg font-bold text-brand-500 mb-4">${t.outcomes_label}</h2>
                            <ul class="space-y-2">
                                ${level.learningOutcomes[currentLang].map(o => `
                                    <li class="flex items-start text-brand-700">
                                        <span class="text-brand-800 mt-1 ${t.dir === 'rtl' ? 'ml-2' : 'mr-2'}">›</span>
                                        <span>${o}</span>
                                    </li>
                                `).join('')}
                            </ul>
                        </section>
                    ` : ''}

                    <!-- Courses List -->
                    <section>
                        <h2 class="text-lg font-bold text-brand-500 mb-4">${t.courses_label}</h2>
                        ${levelCourses.length > 0 ? `
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                ${levelCourses.map(c => renderCourseCard(c)).join('')}
                            </div>
                        ` : `<p class="text-brand-700">${t.no_courses}</p>`}
                    </section>
                `;
            } else if (level.status === 'in_progress') {
                contentHtml = `
                    <!-- In Progress State -->
                    <div class="text-center py-12 bg-white rounded-xl border border-brand-100 mb-10">
                        <h2 class="text-2xl font-bold text-brand-500 mb-2">${t.in_progress_title}</h2>
                        <p class="text-brand-700 max-w-md mx-auto">${t.in_progress_sub}</p>
                    </div>

                    <!-- Courses List Structure Ready -->
                    <section>
                        <h2 class="text-lg font-bold text-brand-500 mb-4">${t.courses_label}</h2>
                        ${levelCourses.length > 0 ? `
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                ${levelCourses.map(c => renderCourseCard(c)).join('')}
                            </div>
                        ` : `<p class="text-brand-700">${t.no_courses}</p>`}
                    </section>
                `;
            } else if (level.status === 'coming_soon') {
                contentHtml = `
                    <!-- Coming Soon State -->
                    <div class="text-center py-16 bg-white rounded-xl border border-brand-100">
                        <h2 class="text-2xl font-bold text-brand-500 mb-2">${t.cs_title}</h2>
                        <p class="text-brand-700">${t.cs_sub}</p>
                    </div>
                `;
            }

            const html = `
                <!-- Level Header -->
                <div class="mb-12">
                    <a href="#/" class="text-sm text-brand-700 hover:text-brand-500 mb-4 inline-block">← ${t.nav_home}</a>
                    <span class="text-sm font-medium text-brand-800">${t.level_label} ${level.id}</span>
                    <div class="flex items-center justify-between mt-2">
                        <h1 class="text-3xl md:text-4xl font-extrabold text-brand-500 tracking-tight">
                            ${level.title[currentLang]}
                        </h1>
                        ${renderStatusBadge(level.status)}
                    </div>
                </div>
                ${contentHtml}
            `;
            document.getElementById('app').innerHTML = html;
        }

        function renderCoursePage(courseId) {
            const course = courses.find(c => c.id === courseId);
            if (!course) return renderHomePage();
            const level = levels.find(l => l.id === course.levelId);

            const html = `
                <div class="mb-8">
                    <a href="#/level/${level.id}" class="text-sm text-brand-700 hover:text-brand-500 mb-4 inline-block">← ${level.title[currentLang]}</a>
                    <span class="block text-sm font-medium text-brand-800 mb-1">${t.level_label} ${level.id}</span>
                    <h1 class="text-3xl md:text-4xl font-extrabold text-brand-500 tracking-tight">
                        ${course.title[currentLang]}
                    </h1>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <!-- Main Content -->
                    <div class="lg:col-span-2 space-y-8">
                        <section>
                            <h2 class="text-lg font-bold text-brand-500 mb-3">${t.intro_label}</h2>
                            <p class="text-brand-700 leading-relaxed">${course.description[currentLang]}</p>
                        </section>

                        <section class="bg-white p-6 rounded-xl border border-brand-100">
                            <h2 class="text-lg font-bold text-brand-500 mb-4">${t.what_you_learn}</h2>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                ${course.topics.map(topic => `
                                    <div class="flex items-center bg-brand-50 px-4 py-2 rounded-md text-sm text-brand-600 font-medium">
                                        ${topic}
                                    </div>
                                `).join('')}
                            </div>
                        </section>
                    </div>

                    <!-- Sidebar -->
                    <div class="lg:col-span-1">
                        <div class="sticky top-24 bg-white p-6 rounded-xl border border-brand-100 space-y-6">
                            <div>
                                <h3 class="text-xs uppercase tracking-wider text-brand-700 mb-1">${t.prepared_by}</h3>
                                <p class="font-semibold text-brand-500">${(course.author || t.tba_author).replace(/Kunuz Team/g, '<span class="company-kunuz">Kunuz Team</span>').replace(/Awaed Team/g, '<span class="company-awaed">Awaed Team</span>')}</p>
                            </div>
                            
                            <div class="border-t border-brand-100 pt-6">
                                <h3 class="text-xs uppercase tracking-wider text-brand-700 mb-2">${t.pdf_section}</h3>
                                ${course.pdfUrl ? `
                                    <a href="${course.pdfUrl.startsWith('embedded:') ? 'pdfs/course_' + course.id + '.pdf' : course.pdfUrl}" data-pdf-action="view" data-pdf-id="${course.id}" target="_blank" class="block w-full text-center bg-brand-500 text-white py-3 rounded-lg font-semibold hover:bg-brand-600 transition-smooth">
                                        ${t.view_pdf}
                                    </a>
                                    <a href="${course.pdfUrl.startsWith('embedded:') ? 'pdfs/course_' + course.id + '.pdf' : course.pdfUrl}" data-pdf-action="download" data-pdf-id="${course.id}" ${'download'} class="block w-full text-center text-brand-700 py-2 mt-2 text-sm hover:text-brand-500 transition-smooth">
                                        ${t.download_pdf}
                                    </a>
                                ` : `
                                    <div class="block w-full text-center bg-brand-100 text-brand-700 py-3 rounded-lg font-semibold cursor-not-allowed">
                                        ${t.pdf_tba}
                                    </div>
                                `}
                            </div>
                        </div>
                    </div>
                </div>
                ${recommendedCourses(course).length ? `<section class="mt-12 border-t border-brand-100 pt-9">
                    <h2 class="text-xl font-bold text-brand-500 mb-6">${t.recommendations}</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">${recommendedCourses(course).map(renderCourseCard).join('')}</div>
                </section>` : ''}
            `;
            document.getElementById('app').innerHTML = html;
        }

        // --- COMPONENTS ---
        function renderCourseCard(course) {
            const company = companyOf(course);
            return `
                <a href="#/course/${course.id}" style="--company-color:${company.color}" class="company-card block p-5 bg-white rounded-xl transition-smooth card-hover">
                    <span class="text-sm font-semibold company-accent">${t.level_label} ${course.levelId}</span>
                    <h3 class="mt-2 font-bold text-brand-500 text-lg mb-2">${course.title[currentLang]}</h3>
                    <p class="text-sm text-brand-700 line-clamp-2">${course.description[currentLang]}</p>
                    <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between gap-3 items-center">
                        <span class="text-xs font-bold company-accent">${company.name}</span>
                        <span class="text-xs font-semibold text-brand-700">${t.view_course} →</span>
                    </div>
                </a>`;
        }

        function renderStatusBadge(status) {
            const styles = {
                available: 'bg-green-100 text-green-700',
                in_progress: 'bg-yellow-100 text-yellow-700',
                coming_soon: 'bg-slate-200 text-slate-600'
            };
            const labels = {
                available: t.status_available,
                in_progress: t.status_progress,
                coming_soon: t.status_soon
            };
            return `<span class="px-2 py-1 rounded-full ${styles[status]}">${labels[status]}</span>`;
        }



        // Self-contained PDF library: all lecture files travel with this HTML.
        const embeddedCoursePdfs = {};
        // PDFs are deployed as regular static files for fast, reliable viewing.
        document.addEventListener('click', event => {
            const link = event.target.closest('a[data-pdf-action]');
            if (!link) return;
            const courseId = link.dataset.pdfId;
            if (!/^\d+$/.test(courseId)) return;
            link.href = 'pdfs/course_' + courseId + '.pdf';
            if (link.dataset.pdfAction === 'download') {
                link.setAttribute('download', 'Kunuz_Academy_Course_' + courseId + '.pdf');
                link.removeAttribute('target');
            } else {
                link.setAttribute('target', '_blank');
                link.setAttribute('rel', 'noopener');
            }
        });

        // Global search remains available across every route.
        document.getElementById('global-search').addEventListener('input', updateSearchResults);
        document.getElementById('global-search').addEventListener('keydown', event => {
            if (event.key === 'Escape') { event.target.value = ''; updateSearchResults(); event.target.blur(); }
            if (event.key === 'Enter') {
                const first = document.querySelector('#search-results a');
                if (first) { event.preventDefault(); window.location.hash = first.getAttribute('href'); event.target.value = ''; updateSearchResults(); }
            }
        });
        document.getElementById('search-results').addEventListener('click', event => {
            if (event.target.closest('a')) { document.getElementById('global-search').value = ''; updateSearchResults(); }
        });
        document.addEventListener('click', event => {
            if (!event.target.closest('#search-wrap')) {
                document.getElementById('search-results').hidden = true;
                document.getElementById('global-search').setAttribute('aria-expanded','false');
            }
        });
        document.getElementById('global-search').addEventListener('focus', updateSearchResults);

        // --- EVENT LISTENERS ---
        window.addEventListener('hashchange', render);
        const languageButton = document.getElementById('lang-toggle');
        if (languageButton) languageButton.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            render();
        });

        // Initial Load
        render();
    </script>
</body>
</html>
